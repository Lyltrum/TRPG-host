# 前端静态文件 + 反代后端。让浏览器看到的一切都在**同一个源**上：
# 前端不用配 CORS，SDK 从页面地址推出的 API/WS 地址天然正确。

upstream backend {
    # 服务名由 compose 解析。
    server backend:8000;
}

server {
    listen 80;
    server_name _;

    # 上传模组用的，默认 1MB 挡不住一份 PDF。
    client_max_body_size 64m;

    root /usr/share/nginx/html;
    index index.html;

    # ── SPA 回退 ────────────────────────────────────────────
    # 🔴 前端是 BrowserRouter（真实路径，不是 hash）。直接访问
    # /home/my-rooms 或扫码进 /join/ABC123 时，nginx 找不到同名文件会 404
    # ——而那两条恰恰是**别人拿到链接后的第一跳**。回退到 index.html 交给
    # 前端路由。
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 带 hash 的构建产物可以长缓存；index.html 绝不能，否则发新版之后
    # 老页面会一直拿着旧的资源清单。
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # ── WebSocket ───────────────────────────────────────────
    # 🔴 必须在 /api 之前：两条 location 都是前缀匹配，而 /ws 是独立前缀。
    # Upgrade/Connection 两个头缺一个，握手就会退化成普通 HTTP 请求，
    # 表现成"连上了又立刻断"。
    location /ws/ {
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 🔴 守秘人一拍要跑多次 LLM 调用，真机撞到过单拍 229 秒。默认
        # 60 秒会在**正常裁决中途**把连接掐掉，表现成"AI 回应到一半没了"。
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # ── REST ────────────────────────────────────────────────
    location /api/ {
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 同上：模组导入是一次长任务（约 71 次 LLM 调用）。
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;

        # 流式叙事走 WS，但别的接口也不该被 nginx 攒着再发。
        proxy_buffering off;
    }
}
