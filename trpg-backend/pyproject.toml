[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "trpg-backend"
version = "0.0.0"
description = "FastAPI backend scaffold for TRPG-master"
requires-python = ">=3.12"
# 运行时依赖：aiosqlite 给本地 SQLite 用、asyncpg 给线上 PostgreSQL 用，
# 两个驱动都装上，靠 DATABASE_URL 这一个环境变量决定实际连哪个。
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.30,<1.0",
  "pydantic>=2.9,<3.0",
  "pydantic-settings>=2.5,<3.0",
  "sqlalchemy[asyncio]>=2.0,<3.0",
  "aiosqlite>=0.20,<1.0",
  "asyncpg>=0.29,<1.0",
  "structlog>=24.4,<25.0",
  "bcrypt>=4.2,<5.0",
  "alembic>=1.13,<2.0",
  "openai>=2.45,<3",
  "openai-agents>=0.18.3",
  "cryptography<49",
  # 模组导入取文层（exec/29 §5）：两个都是 MIT。
  # 🔴 PyMuPDF 更快更全，但它是 AGPL —— 本项目是网络服务，触发条件成立，
  # 且其供应商有实际诉讼记录。pdfplumber 同样提供字级坐标（双栏按列排序可做），
  # 短板只有慢与图片导出别扭，而我们对图只清点不存取，短板用不上。
  "pdfplumber>=0.11,<1.0",
  "python-docx>=1.1,<2.0",
  # `.doc`（Word 97-2003 OLE2 复合文档）：只用它读 OLE2 容器，
  # Word 的分片表（piece table）由我们自己解，见 extract.py。
  "olefile>=0.47,<1.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

# 开发期工具依赖（PEP 735 dependency-groups）：`uv sync` 默认会把这个 dev 组
# 也装进 .venv，不需要额外参数；CI 上用 `uv sync --locked` 保证严格按
# uv.lock 里锁定的版本安装，不会因为依赖漂移导致"本地能跑、CI 跑不过"。
[dependency-groups]
dev = [
  "pytest>=8.0,<9.0",
  "pytest-asyncio>=0.24,<1.0",
  "httpx>=0.27,<1.0",
  "ruff>=0.7,<1.0",
  "ty>=0.0.1a1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
# 让 async def test_xxx(...) 自动被当成异步测试跑，不需要在每个测试函数上
# 手动加 @pytest.mark.asyncio。
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# E/F：pyflakes 基础规则；I：import 排序；UP：升级到新版 Python 写法（比如
# 用 X | None 代替 Optional[X]）；B：常见 bug 陷阱；SIM：可简化的写法；C4：
# 可以用推导式/字面量写得更简洁的地方。
select = ["E", "F", "I", "UP", "B", "SIM", "C4"]
# B008：不检查"函数参数默认值里调用函数"（FastAPI 的 Depends(get_db) 就是
# 这种写法，是框架要求的用法，不是 bug）。
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
# 守秘人 system prompt 是面向 LLM 的中文散文，按句意分行比按 100 列硬折
# 更可读可维护；只豁免行宽，其余规则照常。
"app/core/keeper/narration/prompts.py" = ["E501"]
# 同理：各能力自己那几段 prompt 文本（exec/27 阶段 2 起，prompt 按能力垂直切）。
"app/core/keeper/capabilities/*/prompt.py" = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.ty.environment]
python-version = "3.12"

[tool.ty.src]
include = ["app", "tests", "scripts", "alembic"]
# 一次性的规则数据导入工具（issue #114）。它读的 COC7 规则表不在仓库里，CI 上
# 永远跑不了它，所以 openpyxl 也不该进依赖清单——装一个 CI 用不上的包只为让
# 类型检查过，是本末倒置。产物（raw_occupations.json、生成的 coc7_content.py）
# 都进 git，可审计性由产物保证，不依赖这个脚本能在 CI 里跑。
exclude = ["scripts/coc7_occupations"]
